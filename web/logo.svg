<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 68" width="250" height="68" role="img" aria-label="星图 StarChart">
  <title>星图 StarChart</title>
  <!-- 紧凑横版：可整体放进应用顶栏（约 40px 高）。
       字标用 currentColor —— 独立引用时解析为默认黑，
       内联到页面时由 CSS 的 color 控制，从而跟随明暗主题。 -->
  <defs>
    <!-- 紫靛渐变：与应用页头 / 托盘图标同一品牌色 -->
    <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B7CF8"/>
      <stop offset="100%" stop-color="#5B46E0"/>
    </linearGradient>
  </defs>

  <!-- 图形标：倾斜 14° 的四芒星火 + 一道斜向流星轨迹（单线描边、圆头圆角） -->
  <g transform="translate(-8.4,-5.05) scale(0.63)" fill="none"
     stroke="url(#markGrad)" stroke-width="7.5"
     stroke-linecap="round" stroke-linejoin="round">
    <polygon points="72.7,27.1 73.4,56.3 88.3,68.0 69.7,71.4 55.3,96.9 54.6,67.7 39.7,56.0 58.3,52.6"/>
    <line x1="26" y1="33" x2="63" y2="63"/>
  </g>

  <!-- 字标：STARCHART -->
  <text x="58" y="33" fill="currentColor" font-size="24" font-weight="800"
        letter-spacing="1.5"
        font-family="'Arial Black','Arial Bold',Arial,Helvetica,sans-serif">STARCHART</text>

  <!-- 中文副标题 -->
  <text x="58" y="54" fill="currentColor" opacity=".62" font-size="16" letter-spacing="1"
        font-family="'Microsoft YaHei','PingFang SC',sans-serif">星图 · 本地项目导航</text>
</svg>
